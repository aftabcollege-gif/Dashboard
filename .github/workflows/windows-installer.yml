name: Build and Verify Windows Installer

on:
  workflow_dispatch:
  push:
    paths:
      - "winsetup/**"
      - "backend/**"
      - "frontend/**"
      - ".github/workflows/windows-installer.yml"

jobs:
  build-windows-setup:
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 22 (build host only)
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: "frontend/package-lock.json"

      - name: Install Inno Setup 6
        run: choco install innosetup -y --no-progress

      - name: Build offline Windows setup.exe
        shell: pwsh
        run: |
          .\winsetup\build.ps1

      - name: Verify setup.exe on clean stripped environment
        shell: pwsh
        run: |
          .\winsetup\tests\verify_windows_bundle.ps1

      - name: Upload Windows setup.exe artifact
        uses: actions/upload-artifact@v4
        with:
          name: NexusBI-Windows-x64-Setup
          path: winsetup/dist/setup.exe
          if-no-files-found: error
